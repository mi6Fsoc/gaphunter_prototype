    <script>
      // Polyfill/shim window.fetch to provide a setter for browser extensions and third-party scripts
      (function() {
        try {
          var _f = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return _f; },
            set: function(newFetch) { _f = newFetch; }
          });
        } catch (e) {}

        // Suppress chrome-extension injected script errors from bubbling to app
        window.addEventListener('error', function(e) {
          if (e && e.filename && e.filename.indexOf('chrome-extension://') !== -1) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
